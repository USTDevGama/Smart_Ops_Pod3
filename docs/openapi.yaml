  /api/v1/admin/scenarios/import:
    post:
      tags:
      - settings
      summary: Import Scenarios
      description: 'Load the scenario dataset in one go. Each scenario is published
        straight away.


        The key comes from the scenario''s `id`. A new key starts at version 1; a
        changed scenario

        becomes the next version and retires the old one; an identical one is left
        alone, so the

        same file can be sent again safely.'
