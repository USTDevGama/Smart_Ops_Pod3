          type: integer
          title: Version No
        title:
          type: string
          title: Title
        summary:
          type: string
          title: Summary
      type: object
      required:
      - key
      - version_no
      - title
      - summary
      title: PublishedItem
    ScenarioConfig:
      properties:
        id:
          type: string
          title: Id
        title:
          type: string
          title: Title
