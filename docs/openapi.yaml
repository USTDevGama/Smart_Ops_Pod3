components:
  schemas:
    Body_upload_profile_api_v1_profiles_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
      type: object
      required:
      - file
      title: Body_upload_profile_api_v1_profiles_post
    Brief:
      properties:
        summary:
          type: string
          title: Summary
        items:
          items:
            $ref: '#/components/schemas/BriefItem'
          type: array
          title: Items
      type: object
      required:
      - summary
      - items
      title: Brief
      description: Structured summary of a profile, stored on `profile.brief`.
    BriefItem:
      properties:
        kind:
          type: string
          enum:
          - claim
          - assumption
          - risk
          - weak_point
          - inconsistency
          title: Kind
        text:
          type: string
          title: Text
        segment_ids:
          items:
            type: string
            format: uuid
          type: array
          minItems: 1
          title: Segment Ids
      type: object
      required:
      - kind
      - text
      - segment_ids
      title: BriefItem
      description: 'One thing the ingest LLM call found in the profile.


        `segment_ids` are the chunks it came from. They are required so the persona
        can only

        challenge something the profile really says (code checks the ids exist).'
    ConfigKind:
      type: string
      enum:
      - persona
      - scenario
      - demand
      title: ConfigKind
    ConfigStatus:
      type: string
      enum:
      - draft
      - published
      - retired
      title: ConfigStatus
    DraftBody:
      properties:
        config:
          additionalProperties: true
          type: object
          title: Config
      type: object
      required:
      - config
      title: DraftBody
    EditableKind:
      type: string
      enum:
      - persona
      - demand
      title: EditableKind
      description: What an admin may create and edit by hand. Scenarios are only loaded
        with the import.
    EndReason:
      type: string
      enum:
      - trainee_ended
      - turn_cap
      - concerns_resolved
      - time_limit
      - admin_ended
      title: EndReason
    FileType:
      type: string
      enum:
      - pdf
      - docx
      - txt
      title: FileType
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ImportResult:
      properties:
        created:
          items:
            type: string
          type: array
          title: Created
        updated:
          items:
            type: string
          type: array
          title: Updated
        unchanged:
          items:
            type: string
          type: array
          title: Unchanged
      type: object
      required:
      - created
      - updated
      - unchanged
      title: ImportResult
    KeyOut:
      properties:
        key:
          type: string
          title: Key
        versions:
          items:
            $ref: '#/components/schemas/VersionSummary'
          type: array
          title: Versions
      type: object
      required:
      - key
      - versions
      title: KeyOut
    NewKey:
      properties:
        key:
          type: string
          pattern: ^[a-z0-9][a-z0-9-]{0,99}$
          title: Key
        config:
          additionalProperties: true
          type: object
          title: Config
      type: object
      required:
      - key
      - config
      title: NewKey
    NewSession:
      properties:
        persona_key:
          type: string
          title: Persona Key
        profile_id:
          type: string
          format: uuid
          title: Profile Id
      type: object
      required:
      - persona_key
      - profile_id
      title: NewSession
    NewTurn:
      properties:
        content:
          type: string
          maxLength: 4000
          minLength: 1
          title: Content
      type: object
      required:
      - content
      title: NewTurn
    NewVersion:
      properties:
        config:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Config
      type: object
      title: NewVersion
    ProfileDetail:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        filename:
          type: string
          title: Filename
        file_type:
          $ref: '#/components/schemas/FileType'
