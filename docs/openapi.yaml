          - type: 'null'
        segment_count:
          type: integer
          title: Segment Count
      type: object
      required:
      - id
      - filename
      - file_type
      - status
      - error
      - created_at
      - owner_ref
      - brief
      - segment_count
      title: ProfileDetail
    ProfileOut:
