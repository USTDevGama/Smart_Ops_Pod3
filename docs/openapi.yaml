          type: array
          minItems: 1
          title: Client Objections
        good_answer_contains:
          items:
            type: string
          type: array
          minItems: 1
          title: Good Answer Contains
      type: object
      required:
      - id
      - title
      - situation
      - client_objections
      - good_answer_contains
      title: ScenarioConfig
      description: The situation the client is upset about, and what a good answer
