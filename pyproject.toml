[project]
name = "pod-c-stakeholder"
version = "0.1.0"
description = "Pod C - Simulated Stakeholder Roleplay Agent (backend core)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "sqlalchemy>=2.0.30,<2.1",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "redis>=5,<7",
    "celery>=5.4,<6",
    "langgraph>=0.2,<2",
    "httpx>=0.27,<1",
    "pyyaml>=6,<7",
    "python-multipart>=0.0.9",
    "pdfplumber>=0.11.10",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "ruff>=0.5",
    "jsonschema>=4,<5",
]
ui = [
    "streamlit>=1.40",
]

[tool.uv]
# An application, not a library: uv installs the dependencies and we run the code from this folder.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# our local ./alembic folder is only migration scripts; the import is the library
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
