name: pod-c

# Backend only: the API and the Celery worker. The Streamlit UI is not deployed (a common UI for
# all pods comes later). It stays defined under the "ui" profile for anyone who starts it by hand:
#   docker compose -p pod-c -f compose.prod.yml --profile ui up -d ui

services:
  api:
    image: pod-c-app:${IMAGE_TAG}
    env_file:
      - ./.env
    expose:
      - "8000"
    volumes:
      - pod-c-storage:/app/storage
    networks:
      default: {}
      shared-services:
        # Pod D's API is also called "api" on shared-services, so that name is ambiguous there.
        # Other containers (the common UI later) should call http://pod-c-api:8000.
        aliases:
          - pod-c-api
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 512m
    restart: unless-stopped

  worker:
    image: pod-c-app:${IMAGE_TAG}
    env_file:
      - ./.env
    command:
      [
        "celery",
        "-A",
        "app.workers.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=ingest,assess"
      ]
    volumes:
      - pod-c-storage:/app/storage
    networks:
      - default
      - shared-services
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped

  ui:
    profiles:
      - ui
    image: pod-c-app:${IMAGE_TAG}
    # No env_file: the UI reads only PODC_API_URL, so it never receives the database URL or the
    # model key.
    environment:
      PODC_API_URL: http://api:8000
    command:
      [
        "streamlit",
        "run",
        "ui/streamlit_app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
        "--server.headless=true"
      ]
    ports:
      - "${UI_PORT:-8090}:8501"
    networks:
      - default
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped

networks:
  shared-services:
    external: true

volumes:
  pod-c-storage:
    external: true
