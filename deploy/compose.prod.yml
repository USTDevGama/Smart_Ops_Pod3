name: pod-c

services:
  api:
    image: pod-c-app:${IMAGE_TAG}
    env_file:
      - ./.env
    expose:
      - "8000"
    volumes:
      - pod-c-storage:/app/storage
    networks:
      - default
      - shared-services
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    mem_limit: 512m
    restart: unless-stopped

  worker:
    image: pod-c-app:${IMAGE_TAG}
    env_file:
      - ./.env
    command:
      [
        "celery",
        "-A",
        "app.workers.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=ingest,assess"
      ]
    volumes:
      - pod-c-storage:/app/storage
    networks:
      - default
      - shared-services
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped

  ui:
    image: pod-c-app:${IMAGE_TAG}
    env_file:
      - ./.env
    environment:
      PODC_API_URL: http://api:8000
    command:
      [
        "streamlit",
        "run",
        "ui/streamlit_app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
        "--server.headless=true"
      ]
    ports:
      - "${UI_PORT:-8090}:8501"
    networks:
      - default
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped

networks:
  shared-services:
    external: true

volumes:
  pod-c-storage:
    external: true