name: Deploy POD C

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-pod-c
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: pod-c-app
  # Where the compose file, the .env and .last_good_tag live on the server, plus certs/corp-root.crt
  # (the company proxy's root certificate, used only while building the image). A folder outside
  # the checkout, so they survive from one run to the next. Set the repository variable DEPLOY_DIR
  # to move it. docs/deployment.md lists what has to exist there first.
  DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/data/Smart_Ops_Pod3/deploy' }}
  COMPOSE_FILE: ${{ vars.DEPLOY_DIR || '/data/Smart_Ops_Pod3/deploy' }}/compose.prod.yml

jobs:
  deploy:
    runs-on:
      - self-hosted
      - podc

    steps:
      - name: Checkout
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Not actions/checkout: that is a downloaded action, and the company proxy blocks
          # codeload.github.com (the runner stops at "Set up job" with "Access denied"). Plain git
          # over github.com works. The job's own read-only token is passed for this one command
          # and is never written to .git/config.
          server="${GITHUB_SERVER_URL:-https://github.com}"
          auth="$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"

          git init -q .
          git remote remove origin 2>/dev/null || true
          git remote add origin "$server/$GITHUB_REPOSITORY.git"
          git -c "http.extraheader=AUTHORIZATION: basic $auth" fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q -f FETCH_HEAD
          # The workspace is reused between runs: drop anything left from the last one.
          git clean -ffdxq

      - name: Set image tag
        shell: bash
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Check Docker environment
        shell: bash
        run: |
          docker version
          docker compose version
          docker network inspect shared-services >/dev/null
          docker volume inspect pod-c-storage >/dev/null

      - name: Check the deploy folder
        shell: bash
        run: |
          # Creates the folder if this user may; a root-owned parent makes this fail until an
          # admin creates the folder.
          mkdir -p "$DEPLOY_DIR" 2>/dev/null || true

          if [ ! -d "$DEPLOY_DIR" ] || [ ! -w "$DEPLOY_DIR" ]; then
            echo "::error::$DEPLOY_DIR is missing or not writable by $(whoami). Ask the server admin to create it and give it to this user."
            exit 1
          fi

          mkdir -p "$DEPLOY_DIR/certs"

          if [ ! -f "$DEPLOY_DIR/certs/corp-root.crt" ]; then
            echo "::error::$DEPLOY_DIR/certs/corp-root.crt is missing. Put the company proxy's root certificate (PEM) there; it is not in git. Without it pip and uv cannot verify files.pythonhosted.org during the image build."
            exit 1
          fi

      - name: Stage the corporate root for the build
        shell: bash
        run: |
          mkdir -p ca
          cp "$DEPLOY_DIR/certs/corp-root.crt" ca/corp-root.crt

      - name: Build test image
        shell: bash
        run: |
          docker build \
            --target test \
            -t "${IMAGE_NAME}-test:${IMAGE_TAG}" \
            .

      - name: Run tests
        shell: bash
        run: |
          docker run --rm \
            "${IMAGE_NAME}-test:${IMAGE_TAG}"

      - name: Build production image
        shell: bash
        run: |
          docker build \
            --target runtime \
            -t "${IMAGE_NAME}:${IMAGE_TAG}" \
            .

      - name: Remove test image
        if: always()
        shell: bash
        run: |
          docker rmi "${IMAGE_NAME}-test:${IMAGE_TAG}" || true

      - name: Install compose file and environment
        shell: bash
        env:
          PODC_DATABASE_URL: ${{ secrets.PODC_DATABASE_URL }}
          PODC_LLM_PROVIDER: ${{ secrets.PODC_LLM_PROVIDER }}
          PODC_ANTHROPIC_API_KEY: ${{ secrets.PODC_ANTHROPIC_API_KEY }}
          PODC_ANTHROPIC_MODEL: ${{ secrets.PODC_ANTHROPIC_MODEL }}
          PODC_ANTHROPIC_GATEWAY_URL: ${{ secrets.PODC_ANTHROPIC_GATEWAY_URL }}
          # Key Vault mode (all five, or none): the app fetches the model key from the vault itself.
          # The client secret is the only secret of the five; the rest are identifiers.
          PODC_AZURE_CLIENT_SECRET: ${{ secrets.PODC_AZURE_CLIENT_SECRET }}
          PODC_AZURE_VAULT_URL: ${{ vars.PODC_AZURE_VAULT_URL }}
          PODC_AZURE_VAULT_SECRET_NAME: ${{ vars.PODC_AZURE_VAULT_SECRET_NAME }}
          PODC_AZURE_TENANT_ID: ${{ vars.PODC_AZURE_TENANT_ID }}
          PODC_AZURE_CLIENT_ID: ${{ vars.PODC_AZURE_CLIENT_ID }}
          # Not secrets. Repository variables, so changing them needs no code change.
          # PODC_ENV and PODC_DEV_AUTH_ENABLED go together: the app refuses dev login unless
          # PODC_ENV is local or dev. Until real login (Zitadel) exists, "prod" + "false" means
          # every API call except /healthz, /readyz and /api/v1/meta answers 401.
          PODC_ENV: ${{ vars.PODC_ENV || 'prod' }}
          PODC_DEV_AUTH_ENABLED: ${{ vars.PODC_DEV_AUTH_ENABLED || 'false' }}
          # Claude Sonnet 5.5 rejects "disabled"; match the model above.
          PODC_ANTHROPIC_THINKING_OFF: ${{ vars.PODC_ANTHROPIC_THINKING_OFF || 'between_tools' }}
        run: |
          # Where the model key comes from, decided before anything is written.
          #  - Vault mode (all five PODC_AZURE_* settings): the app fetches the key from the Key
          #    Vault and fetches it again when the gateway rejects it, so a rotated key needs no
          #    redeploy.
          #  - Fixed-key mode (none of them): the key is copied from the GitHub secret and goes
          #    stale when the key is rotated.
          # Never both: in the app a fixed key always beats the vault, so in vault mode the key
          # line is left out completely.
          vault_set=0
          for value in "$PODC_AZURE_VAULT_URL" "$PODC_AZURE_VAULT_SECRET_NAME" \
                       "$PODC_AZURE_TENANT_ID" "$PODC_AZURE_CLIENT_ID" "$PODC_AZURE_CLIENT_SECRET"; do
            if [ -n "$value" ]; then
              vault_set=$((vault_set + 1))
            fi
          done

          if [ "$vault_set" -ne 0 ] && [ "$vault_set" -ne 5 ]; then
            echo "::error::Only $vault_set of the five PODC_AZURE_* settings are set. Set all five (vault mode) or none (fixed key)."
            exit 1
          fi

          if [ "$vault_set" -eq 0 ] && [ -z "$PODC_ANTHROPIC_API_KEY" ]; then
            echo "::error::No model key. Set the five PODC_AZURE_* settings (vault mode) or the secret PODC_ANTHROPIC_API_KEY."
            exit 1
          fi

          cp deploy/compose.prod.yml "$DEPLOY_DIR/compose.prod.yml"

          umask 077
          cat > "$DEPLOY_DIR/.env" <<EOF
          PODC_ENV=${PODC_ENV}
          PODC_DEV_AUTH_ENABLED=${PODC_DEV_AUTH_ENABLED}
          PODC_INGEST_INLINE=false

          PODC_DATABASE_URL=${PODC_DATABASE_URL}

          PODC_REDIS_URL=redis://shared-redis:6379/0
          PODC_CELERY_BROKER_URL=redis://shared-redis:6379/1

          PODC_BLOB_DIR=/app/storage
          PODC_MAX_UPLOAD_MB=10
          PODC_RETENTION_DAYS=30

          PODC_LLM_PROVIDER=${PODC_LLM_PROVIDER}
          PODC_ANTHROPIC_MODEL=${PODC_ANTHROPIC_MODEL}
          PODC_ANTHROPIC_GATEWAY_URL=${PODC_ANTHROPIC_GATEWAY_URL}
          PODC_ANTHROPIC_THINKING_OFF=${PODC_ANTHROPIC_THINKING_OFF}
          PODC_ANTHROPIC_TIMEOUT_S=30
          EOF

          if [ "$vault_set" -eq 5 ]; then
            {
              printf 'PODC_AZURE_VAULT_URL=%s\n' "$PODC_AZURE_VAULT_URL"
              printf 'PODC_AZURE_VAULT_SECRET_NAME=%s\n' "$PODC_AZURE_VAULT_SECRET_NAME"
              printf 'PODC_AZURE_TENANT_ID=%s\n' "$PODC_AZURE_TENANT_ID"
              printf 'PODC_AZURE_CLIENT_ID=%s\n' "$PODC_AZURE_CLIENT_ID"
              printf 'PODC_AZURE_CLIENT_SECRET=%s\n' "$PODC_AZURE_CLIENT_SECRET"
            } >> "$DEPLOY_DIR/.env"
            echo "Model key source: Azure Key Vault (refetched automatically after a rejection)"
          else
            printf 'PODC_ANTHROPIC_API_KEY=%s\n' "$PODC_ANTHROPIC_API_KEY" >> "$DEPLOY_DIR/.env"
            echo "Model key source: fixed key from the GitHub secret (goes stale when the key is rotated)"
          fi

          chmod 600 "$DEPLOY_DIR/.env"

      - name: Validate Compose
        shell: bash
        run: |
          IMAGE_TAG="$IMAGE_TAG" \
          docker compose \
            -p pod-c \
            -f "$COMPOSE_FILE" \
            config --quiet

      - name: Run database migrations
        shell: bash
        run: |
          IMAGE_TAG="$IMAGE_TAG" \
          docker compose \
            -p pod-c \
            -f "$COMPOSE_FILE" \
            run --rm api \
            alembic upgrade head

      - name: Deploy POD C
        shell: bash
        run: |
          IMAGE_TAG="$IMAGE_TAG" \
          docker compose \
            -p pod-c \
            -f "$COMPOSE_FILE" \
            up -d

      - name: Verify deployment
        shell: bash
        run: |
          compose() {
            IMAGE_TAG="$IMAGE_TAG" docker compose -p pod-c -f "$COMPOSE_FILE" "$@"
          }

          # The API container is healthy, the API reaches its database (/readyz), and the worker
          # answers a Celery ping (so it reached Redis). There is no UI to curl: the API is not
          # published on the host.
          ok=0

          for i in $(seq 1 20); do
            cid="$(compose ps -q api)"
            health=""

            if [ -n "$cid" ]; then
              health="$(docker inspect --format '{{.State.Health.Status}}' "$cid" 2>/dev/null || true)"
            fi

            if [ "$health" = "healthy" ] \
              && compose exec -T api python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=5)" \
              && compose exec -T worker celery -A app.workers.celery_app:celery_app inspect ping -t 5; then
              ok=1
              break
            fi

            sleep 3
          done

          if [ "$ok" -ne 1 ]; then
            echo "POD C failed health verification."
            compose ps
            compose logs --tail=100

            # Put the last tag that passed this check back, if there is one.
            last_good=""
            if [ -f "$DEPLOY_DIR/.last_good_tag" ]; then
              last_good="$(cat "$DEPLOY_DIR/.last_good_tag")"
            fi

            if [ -n "$last_good" ] && [ "$last_good" != "$IMAGE_TAG" ]; then
              echo "Rolling back to image tag $last_good (database migrations are not rolled back)."
              IMAGE_TAG="$last_good" \
              docker compose \
                -p pod-c \
                -f "$COMPOSE_FILE" \
                up -d
            fi

            exit 1
          fi

          echo "$IMAGE_TAG" > "$DEPLOY_DIR/.last_good_tag"

      - name: Check the model key (warning only)
        shell: bash
        run: |
          compose() {
            IMAGE_TAG="$IMAGE_TAG" docker compose -p pod-c -f "$COMPOSE_FILE" "$@"
          }

          # One tiny model call from inside the API container, with the container's own settings.
          # It never fails the deploy (a dead key does not make the new image worse than the old
          # one), but it turns a stale or rotated key into a visible warning here instead of a
          # failed chat later. The output is a reason code only, never the key.
          probe='
          from app.llm import get_llm_client
          from app.llm.base import LLMError, LLMRequest, Message

          try:
              get_llm_client().complete(
                  LLMRequest(
                      purpose="deploy-check",
                      system="Reply with one word.",
                      messages=[Message(role="user", content="hello")],
                      max_tokens=20,
                  )
              )
              print("OK")
          except LLMError as exc:
              print("FAILED:", exc)
          '

          result="$(compose exec -T api python -c "$probe" 2>&1 || true)"
          echo "$result"

          if printf '%s\n' "$result" | grep -qx 'OK'; then
            echo "Model key OK."
          else
            reason="$(printf '%s\n' "$result" | tail -n 1)"
            echo "::warning title=Model key check failed::${reason}. The deploy continues, but chats and reports will fail until the key is fixed. In vault mode check the vault secret and the Azure client secret; with a fixed key update the secret PODC_ANTHROPIC_API_KEY and redeploy."
          fi

      - name: Remove old images
        shell: bash
        run: |
          # The root disk is small and shared by every pod: keep the three newest pod-c-app tags
          # and the last good one. Only our own image is touched.
          last_good="$(cat "$DEPLOY_DIR/.last_good_tag" 2>/dev/null || true)"

          docker image ls "$IMAGE_NAME" --format '{{.Tag}}' | tail -n +4 | while read -r tag; do
            if [ "$tag" = "$IMAGE_TAG" ] || [ "$tag" = "$last_good" ]; then
              continue
            fi

            docker rmi "${IMAGE_NAME}:${tag}" || true
          done

      - name: Deployment summary
        shell: bash
        run: |
          echo "POD C deployed with image tag: ${IMAGE_TAG}"
          IMAGE_TAG="$IMAGE_TAG" \
          docker compose \
            -p pod-c \
            -f "$COMPOSE_FILE" \
            ps
